[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nl2sql-client"
version = "0.1.0"
description = "Thin Python client for the nl2sql sidecar"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["nl2sql_client"]
